[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readerguard"
version = "0.3.0"
description = "Rebuild documents and web pages (PDF, HTML/URL, Office, Markdown, text, images) into only what a person can see, before an AI reads them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pymupdf>=1.26", "numpy>=1.24", "pillow>=10.3", "defusedxml>=0.7"]

[project.optional-dependencies]
bench = ["pdfminer.six>=20231228", "pdfplumber>=0.11", "python-docx", "python-pptx", "openpyxl",
         "markitdown[all]>=0.1", "beautifulsoup4", "html2text", "docx2txt"]

[project.scripts]
readerguard = "readerguard.cli:main"

[tool.setuptools]
packages = ["readerguard", "readerguard.pdf", "readerguard.formats"]
